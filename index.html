<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>EcoHarvest - ODS 2</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <h1>🌱 EcoHarvest</h1>
        <p>ODS 2 - Fome Zero e Agricultura Sustentável</p>
    </header>

    <nav>
        <button onclick="mostrarTela('jogo')">Jogo</button>
        <button onclick="mostrarTela('simulacao')">Simulação 5 Anos</button>
    </nav>

    <main>

        <section id="jogo" class="tela ativa">

            <h2>Gerencie sua Comunidade</h2>

            <div class="painel">

                <div class="card">
                    <h3>🌾 Alimentos</h3>
                    <p id="alimentos">100</p>
                </div>

                <div class="card">
                    <h3>👨‍👩‍👧‍👦 População</h3>
                    <p id="populacao">100</p>
                </div>

                <div class="card">
                    <h3>🌳 Sustentabilidade</h3>
                    <p id="sustentabilidade">50</p>
                </div>

            </div>

            <button id="sortearEvento">
                Próximo Evento
            </button>

            <div id="evento" class="evento">
                Clique para iniciar.
            </div>

            <div id="opcoes"></div>

        </section>

        <section id="simulacao" class="tela">

            <h2>E se todos fizessem isso por 5 anos?</h2>

            <p id="resultadoFinal">
                Jogue primeiro para gerar um cenário.
            </p>

            <button onclick="gerarSimulacao()">
                Gerar Simulação
            </button>

        </section>

    </main>

    <script src="script.js"></script>

</body>

</html>
